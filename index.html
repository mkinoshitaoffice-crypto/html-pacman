<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F2">
<title>ぴよまるパックン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ============ HUD ============ -->
  <header class="hud">
    <div class="hud__row">
      <div class="stat">
        <span class="stat__label">スコア</span>
        <span class="stat__value" id="score">0</span>
      </div>
      <div class="stage-badge" id="stageBadge">ステージ 1</div>
      <div class="stat stat--right">
        <span class="stat__label">ハイスコア</span>
        <span class="stat__value" id="highScore">0</span>
      </div>
    </div>
    <div class="hud__row hud__row--bottom">
      <div class="lives" id="lives" aria-label="のこり"></div>
      <div class="gauge" id="gauge" hidden>
        <div class="gauge__fill" id="gaugeFill"></div>
      </div>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="サウンド切り替え" aria-pressed="true">
        <span id="soundIcon">♪</span>
      </button>
    </div>
  </header>

  <!-- ============ STAGE ============ -->
  <main class="stage">
    <div class="stage__inner" id="stageInner">
      <canvas id="game" width="672" height="744" aria-label="めいろ"></canvas>

      <div class="overlay" id="overlay" hidden>
        <div class="panel" id="panel">
          <p class="panel__eyebrow" id="panelEyebrow"></p>
          <h1 class="panel__title" id="panelTitle">ぴよまるパックン</h1>
          <p class="panel__text" id="panelText"></p>
          <div class="panel__score" id="panelScore" hidden>
            <span class="panel__score-label">スコア</span>
            <strong id="panelScoreValue">0</strong>
          </div>
          <button class="btn btn--primary" id="primaryBtn" type="button">はじめる</button>
          <p class="panel__hint" id="panelHint">やじるしキー / WASD でうごく・Pでポーズ</p>
        </div>
      </div>

      <div class="toast" id="toast" hidden></div>
    </div>
  </main>

  <!-- ============ CONTROLS ============ -->
  <footer class="controls">
    <div class="dpad" id="dpad">
      <img src="png/ui-dpad.png" alt="" class="dpad__img" draggable="false">
      <button class="dpad__btn dpad__btn--up"    type="button" data-dir="up"    aria-label="うえ"></button>
      <button class="dpad__btn dpad__btn--left"  type="button" data-dir="left"  aria-label="ひだり"></button>
      <button class="dpad__btn dpad__btn--right" type="button" data-dir="right" aria-label="みぎ"></button>
      <button class="dpad__btn dpad__btn--down"  type="button" data-dir="down"  aria-label="した"></button>
    </div>
    <div class="controls__side">
      <button class="btn btn--secondary btn--sm" id="pauseBtn" type="button">ポーズ</button>
      <p class="legend">
        <span class="legend__item"><img src="png/chaser-moko.png" alt="">もこ</span>
        <span class="legend__item"><img src="png/chaser-mimiko.png" alt="">みみこ</span>
        <span class="legend__item"><img src="png/chaser-pote.png" alt="">ぽて</span>
        <span class="legend__item"><img src="png/chaser-kuron.png" alt="">くろん</span>
      </p>
    </div>
  </footer>

</div>

<script src="game.js"></script>
</body>
</html>
